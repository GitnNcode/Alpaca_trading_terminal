[package]
name = "alpaca-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_plot = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
csv = "1.3"
# Sync WebSocket client for the live data stream. native-tls keeps the build
# simple on macOS/Windows (system TLS) — switch to rustls-tls-webpki-roots
# if cross-compile to musl ever matters.
tungstenite = { version = "0.24", features = ["native-tls"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
