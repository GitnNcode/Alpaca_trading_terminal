name: Build Linux binary & deploy download site

# Two jobs:
#   1. build-linux — compile the Rust egui app on a real Ubuntu runner (a GUI
#      app can't be cross-compiled cleanly from macOS/Windows) and hand the
#      binary to the deploy job as an artifact. It is NOT committed back to the
#      repo, so a push never forces you to pull afterward.
#   2. deploy — stage website/ + binaries/ into _site (preserving the site's
#      ../binaries relative links), inject the freshly built Linux binary, and
#      publish to GitHub Pages. Pages is enabled automatically (enablement: true)
#      so there is no manual Settings toggle. The site ends up at
#      https://<owner>.github.io/<repo>/website/

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'binaries/**'
      - 'main-trading-terminal-rust/src/**'
      - 'main-trading-terminal-rust/Cargo.toml'
      - 'main-trading-terminal-rust/Cargo.lock'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read    # checkout only — the workflow no longer writes to the repo
  pages: write      # publish to Pages
  id-token: write   # OIDC token for actions/deploy-pages

concurrency:
  group: deploy-site
  cancel-in-progress: false   # never cancel an in-flight Pages deploy

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install egui / eframe system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: main-trading-terminal-rust

      - name: Build release binary
        working-directory: main-trading-terminal-rust
        run: cargo build --release

      - name: Stage binary
        run: |
          mkdir -p out
          cp main-trading-terminal-rust/target/release/alpaca-egui \
             out/Alpaca_Trading_Terminal_Rust_LINUX
          chmod +x out/Alpaca_Trading_Terminal_Rust_LINUX

      - name: Upload binary for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: out/Alpaca_Trading_Terminal_Rust_LINUX
          if-no-files-found: error

  deploy:
    needs: build-linux
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage _site (keeps the site's ../binaries links valid)
        run: |
          mkdir -p _site/website _site/binaries/main-trading-terminal-rust
          cp -R website/.  _site/website/
          cp -R binaries/. _site/binaries/

      # Drop the freshly built Linux binary in on top, so the published site is
      # never stale even though it is never committed to the repo.
      - name: Inject the freshly built Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: _site/binaries/main-trading-terminal-rust

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # create/enable the Pages site automatically — no manual Settings toggle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
