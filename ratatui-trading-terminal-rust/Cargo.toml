[package]
name = "alpaca-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
csv = "1.3"
unicode-width = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
